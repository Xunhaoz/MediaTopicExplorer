name: Deploy reports to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["reports/**", "scripts/build_index.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html
        run: python3 scripts/build_index.py
      # 只發布 index.html 和 reports/，不把 .claude/skills 等原始碼放上網站
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r reports _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
