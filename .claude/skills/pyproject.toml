[project]
name = "skillkit"
version = "0.1.0"
description = "MediaTopicExplorer 各資料來源 skill 的共用套件：時間、輸出格式、參數、HTTP。"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "selectolax>=1.0",
    "feedparser>=6.0",
    "google-auth[requests]>=2.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillkit"]
